[package]
name = "shopping-sessions-fast"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[[bin]]
name = "scan-floor"
path = "src/scan_floor.rs"
required-features = ["bench"]

[features]
bench = []

[dependencies]
ahash = "0.8"
memmap2 = "0.9"
memchr = "2"
parquet = { version = "57", default-features = false }
rayon = "1.11"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
